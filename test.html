<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Польовий Модуль — Test Harness V19.27</title>
  <link rel="stylesheet" href="./styles.css?v=19666">
  <style>
    body{padding:1rem;max-width:900px;margin:0 auto;}
    .test-page-box{border:1px solid var(--line);border-radius:1rem;padding:1rem;background:rgba(0,0,0,.22);}
    .test-page-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin:.75rem 0;}
  </style>
</head>
<body>
  <div class="test-page-box">
    <h1>🧪 Польовий Модуль — Test Harness</h1>
    <p>Ця сторінка завантажує той самий <code>app.js</code> і запускає розширені внутрішні тести без ручного проходження всіх функцій.</p>
    <div class="test-page-actions">
      <button class="metal-btn" id="runTestPage">Запустити тести</button>
      <a class="metal-btn" href="./?role=gm&room=test19666&gmKey=zona-master&v=19666&hard=19666">Відкрити Майстра</a>
    </div>
    <div id="testPageReport">Натисни “Запустити тести”.</div>
  </div>

  <main hidden>
    <span id="characterName"></span><span id="hpNow"></span><span id="hpMax"></span><span id="fatigueNow"></span><span id="defenseNow"></span><span id="radiationNow"></span><span id="ammoNow"></span>
    <div id="hpDots"></div><div id="fatigueDots"></div><div id="radDots"></div><div id="ammoDots"></div>
    <div id="characterDetails"></div>
    <span id="sceneNameShort"></span><span id="sceneDescShort"></span>
    <div id="sceneName"></div><div id="sceneDescription"></div><div id="sceneSounds"></div><div id="sceneSmells"></div><ul id="sceneObjects"></ul>
    <div id="enemyTemplateDock"></div><div id="enemyCards"></div>
    <div id="inventoryList"></div><div id="inventoryInlineList"></div>
    <div id="targetSelector"></div>
    <div id="journalList"></div><div id="journalPrivateTargets"></div>
    <div id="gmQuickPanel"></div><div id="gmCombatPanel"></div><div id="gmPlayers"></div><div id="gmEnemies"></div>
    <select id="lootTargetPlayer"></select><select id="enemyAttackTarget"></select>
    <div id="playerSpecificLinks"></div><div id="gmCombatStickyBar"></div><div id="toast" hidden></div>
  </main>

  <script>
    window.POLOVYI_MODUL_TEST_PAGE = true;
  </script>
  <script src="./app.js?v=19666"></script>
  <script>
    document.querySelector("#runTestPage").addEventListener("click", () => {
      const box = document.querySelector("#testPageReport");
      try{
        if(!window.POLOVYI_MODUL_TESTS){
          box.textContent = "❌ POLOVYI_MODUL_TESTS не знайдено.";
          return;
        }
        const results = window.POLOVYI_MODUL_TESTS.runFullInternalTests();
        box.innerHTML = window.POLOVYI_MODUL_TESTS.renderTestReport("Static test.html report", results);
      }catch(err){
        box.textContent = "❌ Test harness error: " + err.message;
        console.error(err);
      }
    });
  </script>
</body>
</html>
